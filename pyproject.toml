[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "islp_selection"
version = "0.1.0"
dependencies = [
    "hydra-core>=1.3.2",
    "ISLP"
]

[project.optional-dependencies]
dev = ["nox", "pytest", "pre-commit", "isort", "black"]

[tool.isort]
profile = "black"